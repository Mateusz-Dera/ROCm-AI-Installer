version: '3.8'

services:
  rocm-container:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Which per-architecture ROCm packages the image installs. Changing the
        # GFX selection therefore needs a rebuild, not just a restart.
        TARGET_GFX_ALL: ${TARGET_GFX_ALL:-gfx1100}
    image: rocm-ai-installer:latest
    container_name: rocm
    hostname: rocm

    # Use host network - all ports automatically available
    network_mode: "host"

    # Pass through AMD GPU devices
    devices:
      - /dev/dri:/dev/dri              # Direct Rendering Infrastructure for GPU
      - /dev/kfd:/dev/kfd              # Kernel Fusion Driver for ROCm compute

    # Privileged mode for full GPU device access
    privileged: true

    # Security options for GPU access
    security_opt:
      - seccomp=unconfined
      - label=disable

    # Add capabilities for device access
    cap_add:
      - SYS_PTRACE

    # Keep host supplementary groups for proper device access
    # This ensures the container user inherits the host user's groups
    group_add:
      - keep-groups

    # Environment variables for ROCm
    environment:
      - ROCM_PATH=/opt/rocm
      # No default and no "=": written this way the variable reaches the
      # container only when install.sh exports it, and stays absent otherwise.
      # It must never arrive empty - ROCm reads an empty override as "no
      # architecture" and then reports no GPU at all. It used to default to
      # 11.0.0, which on this machine also relabelled the integrated GPU as a
      # 7900 XTX; the override is for cards ROCm has no kernels for, not for all.
      - HSA_OVERRIDE_GFX_VERSION
      - TARGET_GFX=${TARGET_GFX:-gfx1100}  # Primary architecture: prebuilt wheels are matched against this one
      # Single-level defaults only: podman-compose does not parse a nested
      # ${A:-${B:-c}} and leaves the inner closing brace in the value, which
      # would hand the build an architecture list ending in "}".
      - TARGET_GFX_ALL=${TARGET_GFX_ALL:-gfx1100}  # Every selected architecture, semicolon separated
      # Source builds get the full list, so a machine with two different cards
      # produces kernels for both instead of only for the primary one.
      - PYTORCH_ROCM_ARCH=${TARGET_GFX_ALL:-gfx1100}
      # Telemetry off for every application in the container. podman exec
      # inherits these, so no generated run.sh has to repeat them.
      - GRADIO_ANALYTICS_ENABLED=False
      - HF_HUB_DISABLE_TELEMETRY=1
      - DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      - VLLM_NO_USAGE_STATS=1
      - VLLM_DO_NOT_TRACK=1
      - ANONYMIZED_TELEMETRY=False
      - WANDB_DISABLED=true
      - WANDB_MODE=offline
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      # X11/Wayland display for GUI applications
      - DISPLAY=${DISPLAY_VAR}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY_VAR}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR_VAR}

    # Keep container running
    stdin_open: true
    tty: true

    # Mount volumes for persistent data
    volumes:
      # Mount host directory to /AI in container
      # In rootless podman, root in container (UID 0) maps to host user
      - ${AI_HOST_DIR}:/AI
      - /etc/localtime:/etc/localtime:ro  # Inherit timezone from host
      - /tmp/.X11-unix:/tmp/.X11-unix:rw  # X11 socket for GUI applications
      - ${XDG_RUNTIME_DIR_VAR}:${XDG_RUNTIME_DIR_VAR}:rw  # Wayland socket

    # Set working directory
    working_dir: /AI

    # Restart policy
    restart: unless-stopped
